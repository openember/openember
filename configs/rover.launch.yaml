# Diff-drive rover host demo (software kinematics + safety).
# launch_manager is the Link router; sim + teleop attach as clients.
#
# Manual:
#   ./build/bin/openember_rover_sim --router
#   ./build/bin/openember_rover_teleop --client --demo

runtime:
  robot_id: openember
  namespace: ""
  link:
    mode: router
    listen: tcp/127.0.0.1:7447

nodes:
  - name: rover_sim
    kind: application
    command: ${openember.bin}/openember_rover_sim
    args: ["--client"]
    restart: on-failure
    restart_limit: 3
    startup_timeout_ms: 5000
    shutdown_timeout_ms: 3000
    heartbeat_timeout_ms: 0

  - name: rover_teleop
    kind: application
    command: ${openember.bin}/openember_rover_teleop
    args: ["--client", "--demo"]
    restart: on-failure
    restart_limit: 3
    startup_timeout_ms: 5000
    shutdown_timeout_ms: 3000
    heartbeat_timeout_ms: 0
