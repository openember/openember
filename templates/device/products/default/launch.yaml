# Minimal launch for __PRODUCT_NAME__ / model __MODEL__.
runtime:
  robot_id: openember
  namespace: ""
  link:
    mode: router
    listen: tcp/127.0.0.1:7447

nodes:
  - name: __PRODUCT_SLUG___app
    kind: application
    command: ${openember.bin}/openember___PRODUCT_SLUG___app
    args: ["--client"]
    restart: on-failure
    restart_limit: 3
    startup_timeout_ms: 5000
    shutdown_timeout_ms: 3000
    heartbeat_timeout_ms: 5000
